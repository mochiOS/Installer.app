[workspace]

[package]
name = "installer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mochios-device-consent = { path = "../../tools/devkit/crates/device-consent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
ed25519-dalek = { version = "2", default-features = false }
mochios-system-image = { path = "../../boot/crates/system-image" }
mochios-boot-selection = { path = "../../boot/crates/boot-selection" }
ext4plus = { path = "../../services/third_party/ext4plus", default-features = false, features = ["multi-threaded", "sync"] }
appcore = { package = "mochios-appcore", path = "../../tools/devkit/crates/appcore" }

[[bin]]
name = "installer"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }

[target.'cfg(target_os = "mochios")'.dependencies]
mochi-user-platform = { path = "../../user/crates/platform", default-features = false, features = ["std"] }
mochios-filesystem-protocol = { path = "../../user/crates/filesystem-protocol" }

[[bin]]
name = "installer-image-sign"
path = "src/bin/image-sign.rs"
