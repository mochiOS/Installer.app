[workspace]

[package]
name = "installer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mochios-device-consent = { path = "../../tools/devkit/crates/device-consent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
appcore = { package = "mochios-appcore", path = "../../tools/devkit/crates/appcore" }

[[bin]]
name = "installer"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }
