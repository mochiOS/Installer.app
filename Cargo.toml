[workspace]

[package]
name = "installer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mochios-device-consent = { git = "https://github.com/mochiOS/devkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
ed25519-dalek = { version = "2", default-features = false }
mochios-system-image = { git = "https://github.com/mochiOS/boot" }
mochios-boot-selection = { git = "https://github.com/mochiOS/boot" }
ext4plus = { git = "https://github.com/mochiOS/services", default-features = false, features = ["multi-threaded", "sync"] }
appcore = { package = "mochios-appcore", git = "https://github.com/mochiOS/devkit" }

[[bin]]
name = "installer"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }

[target.'cfg(target_os = "mochios")'.dependencies]
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", default-features = false, features = ["std"] }
mochios-filesystem-protocol = { git = "https://github.com/mochiOS/syscalls" }

[[bin]]
name = "installer-image-sign"
path = "src/bin/image-sign.rs"
