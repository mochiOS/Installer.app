format = 1

[package]
provenance = "built-in"
id = "org.mochios.installer"
name = "Installer"
version = "0.1.0"
revision = 1
vendor = "mochiOS"
kind = "application"
architecture = "x86_64"
abi = "mochios-1"

[application]
entry = "entry.elf"
description = "Installer for mochiOS"
icon = "appicon.png"
resources = ["appicon.png", "legal/catalog.json", "legal/active-usage-data.en.txt", "legal/active-usage-destination.en.txt", "legal/active-usage-exclusions.en.txt", "legal/active-usage-purpose.en.txt", "legal/active-usage-retention.en.txt", "legal/active-usage-settings.en.txt", "legal/active-usage-summary.en.txt", "legal/crash-reports-data.en.txt", "legal/crash-reports-destination.en.txt", "legal/crash-reports-exclusions.en.txt", "legal/crash-reports-purpose.en.txt", "legal/crash-reports-retention.en.txt", "legal/crash-reports-settings.en.txt", "legal/crash-reports-summary.en.txt", "legal/example-license.txt", "legal/mochios-license.txt", "legal/performance-diagnostics-data.en.txt", "legal/performance-diagnostics-destination.en.txt", "legal/performance-diagnostics-exclusions.en.txt", "legal/performance-diagnostics-purpose.en.txt", "legal/performance-diagnostics-retention.en.txt", "legal/performance-diagnostics-settings.en.txt", "legal/performance-diagnostics-summary.en.txt", "legal/privacy.txt", "legal/terms.txt"]

[[binary]]
path = "/system/applications/Installer.app/entry.elf"
kind = "application"
requires = [
	"fs.read.all",
	"fs.write.all",
	"system.time.read",
	"ipc.client",
	"ipc.server",
	"window.create",
]
